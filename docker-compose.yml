
services:
  server1:
    build: .
    command: python -m src.servers.server 5001

  server2:
    build: .
    command: python -m src.servers.server 5002

  server3:
    build: .
    command: python -m src.servers.server 5003

  load-balancer:
    build: .
    command: python -m src.balancer.main ${ALGORITHM:-round_robin}
    environment:
      SERVERS: "http://server1:5001,http://server2:5002,http://server3:5003"
    ports:
      - "8000:8000"
    depends_on:
      - server1
      - server2
      - server3

  apache-benchmark:
    image: alpine:3.20
    profiles: ["test"]
    depends_on:
      - load-balancer
    entrypoint:
      - sh
      - -c
      - apk add --no-cache apache2-utils > /dev/null && ab -n 1000 -c 50 http://load-balancer:8000/

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/${ALGORITHM:-round_robin}.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8001:80"
    depends_on:
      - server1
      - server2
      - server3

  apache-benchmark-nginx:
    image: alpine:3.20
    profiles: ["test"]
    depends_on:
      - nginx
    entrypoint:
      - sh
      - -c
      - apk add --no-cache apache2-utils > /dev/null && ab -n 1000 -c 50 http://nginx:80/
