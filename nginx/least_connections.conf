upstream shopnow {
    least_conn;
    server server1:5001 max_fails=1 fail_timeout=3s;
    server server2:5002 max_fails=1 fail_timeout=3s;
    server server3:5003 max_fails=1 fail_timeout=3s;
}

server {
    listen 80;

    location / {
        proxy_pass http://shopnow;
        proxy_connect_timeout 1s;
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 3;
    }
}